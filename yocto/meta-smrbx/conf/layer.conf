# meta-smrbx: the few local additions on top of meta-ros (and, for the Kria,
# meta-xilinx and meta-kria) that the SMAROBIX builds for the Kria K26 and the
# Raspberry Pi 5 need.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "smrbx"
BBFILE_PATTERN_smrbx = "^${LAYERDIR}/"
BBFILE_PRIORITY_smrbx = "10"

LAYERDEPENDS_smrbx = "core ros2-layer virtualization-layer"
LAYERSERIES_COMPAT_smrbx = "scarthgap"
