# meta-smrbx: the few local additions on top of meta-ros, meta-xilinx and
# meta-kria that the smarobix Kria builds need.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "smrbx"
BBFILE_PATTERN_smrbx = "^${LAYERDIR}/"
BBFILE_PRIORITY_smrbx = "10"

LAYERDEPENDS_smrbx = "core ros2-layer virtualization-layer"
LAYERSERIES_COMPAT_smrbx = "scarthgap"
