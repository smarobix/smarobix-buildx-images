header:
  version: 14

repos:
  # Local layer from this repository (yocto/meta-smrbx), copied into the work
  # directory. kas runs in a container with the work directory mounted at
  # /work, which is where this path and DL_DIR/SSTATE_DIR below point; adjust
  # them if you run kas differently.
  meta-smrbx:
    path: "/work/buildx-yocto/meta-smrbx"

local_conf_header:
  smrbx: |
    DL_DIR = "/work/downloads"
    SSTATE_DIR = "/work/sstate"
    BB_NUMBER_THREADS = "12"
    PARALLEL_MAKE = "-j 12"
    # board images also as a compressed wic plus its bmap, for bmaptool
    IMAGE_FSTYPES:append = " wic.bz2 wic.bmap"

    # ros-sdk-env is what sets OE_CMAKE_TOOLCHAIN_FILE, derives PYTHON_SOABI from
    # the target sysroot, and sources the target setup.bash for AMENT_PREFIX_PATH.
    # Nothing in meta-ros scarthgap references the recipe -- it is not in
    # ROS_SDK_HOST_PACKAGES nor any image -- so a stock populate_sdk omits it and
    # the SDK cannot configure a ROS workspace. Pull it in explicitly.
    TOOLCHAIN_HOST_TASK:append = " nativesdk-ros-sdk-env"

    # Demo deploy target: the workspace is pushed to the board with rsync over
    # SSH. ros-image-core is core-image-minimal-based and ships neither. OpenSSH
    # rather than dropbear: modern scp speaks SFTP by default, and dropbear has
    # no sftp-server.
    IMAGE_FEATURES += "ssh-server-openssh"
    IMAGE_INSTALL:append = " rsync"

    # The SDK is for building against, not debugging on: the default
    # "dev-pkgs dbg-pkgs src-pkgs" made debug symbols 72% and debug sources 8%
    # of the KV260 SDK's 6.0 GB target sysroot. Headers and libraries only.
    SDKIMAGE_FEATURES = "dev-pkgs"
