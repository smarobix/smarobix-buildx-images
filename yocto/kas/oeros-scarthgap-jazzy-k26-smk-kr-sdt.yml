# Top-level kas config for the AMD Kria KR260 Robotics Starter Kit
# (machine k26-smk-kr-sdt).
#
# An overlay on the kas files of meta-ros's `build` branch, at commit
# 4212d293d5779d3c3b8c445de15066e640d2e601; it cannot be used on its own. Like
# meta-ros's own top-level configs, it is copied into that checkout's kas/
# directory and built together with smrbx-shared.yml. See
# https://smarobix.github.io/smarobix-buildx-images/maintain/yocto/
header:
  version: 14
  includes:
    - kas/yocto/scarthgap.yml
    - kas/ros2/jazzy.yml
    - kas/machine/k26-smk-kr-sdt.yml
    - kas/common.yml
    - kas/layer/lts-mixins.yml

repos:
  lts-mixins:
    branch: "scarthgap/rust"
