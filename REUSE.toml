# Licensing for files that carry no SPDX header of their own. A header in the
# file itself always wins over these entries (precedence "closest"). When a
# file matches several entries, the last one applies.
version = 1

# Documentation, data and ignore files. docs/**, mkdocs.yml and targets.yml are
# listed ahead of time for the documentation site.
[[annotations]]
path = [
    "**.md",
    "**.json",
    "NOTICE",
    ".gitignore",
    "docs/**",
    "mkdocs.yml",
    "targets.yml",
]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 SMAROBIX GmbH"
SPDX-License-Identifier = "Apache-2.0"

# Files the pynq-z1 and rpi Dockerfiles COPY into the image. A header in them
# would change the COPY checksum and force a cold source rebuild of ten images.
[[annotations]]
path = [
    "dockerfiles/pynq-z1/extra.repos.*",
    "dockerfiles/rpi/extra.repos.*",
    "dockerfiles/rpi/patch-sources",
    "dockerfiles/rpi/ros-build",
]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 SMAROBIX GmbH"
SPDX-License-Identifier = "Apache-2.0"

# Everything under yocto/ is MIT, the OpenEmbedded and meta-ros convention.
[[annotations]]
path = ["yocto/**.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 SMAROBIX GmbH"
SPDX-License-Identifier = "MIT"

# The brand faces, copied from brand-core/fonts/. Each family keeps its own
# copyright line; the licence text they share is in LICENSES/OFL-1.1.txt.
[[annotations]]
path = ["docs/assets/fonts/Syne-*.woff2"]
precedence = "closest"
SPDX-FileCopyrightText = "2017 The Syne Project Authors (https://gitlab.com/bonjour-monde/fonderie/syne-typeface)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["docs/assets/fonts/WorkSans-*.woff2"]
precedence = "closest"
SPDX-FileCopyrightText = "2019 The Work Sans Project Authors (https://github.com/weiweihuanghuang/Work-Sans)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["docs/assets/fonts/RobotoMono-*.woff2"]
precedence = "closest"
SPDX-FileCopyrightText = "2015 The Roboto Mono Project Authors (https://github.com/googlefonts/robotomono)"
SPDX-License-Identifier = "OFL-1.1"

# The SMAROBIX marks. They are trademarks, not part of the Apache-2.0 grant
# this repository makes for its code: a fork may keep the code and must not
# keep the marks. See LICENSES/LicenseRef-SMAROBIX-Brand.txt.
[[annotations]]
path = ["docs/assets/mark.svg", "docs/assets/logo.svg"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 SMAROBIX GmbH"
SPDX-License-Identifier = "LicenseRef-SMAROBIX-Brand"
