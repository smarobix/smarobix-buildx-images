  # Yocto / meta-ros dev containers: an aarch64 OCI image of the board's own
  # userspace plus compilers and -dev packages, built by bitbake from the
  # same configuration as the board image (yocto/, recipe ros-dev-container).
  # Bitbake runs outside CI, so these are pushed by hand and have no build.
  - id: k26-yocto-jazzy
    image: k26-yocto
    distro: jazzy
    family: yocto-native
    board: Kria K26 / Yocto
    boards: Kria K26 (KV260 / KR260) running the Yocto image built from yocto/
    os: {name: Yocto / meta-ros, codename: scarthgap}
    arch: arm64
    platform: linux/arm64
    rmw: rmw_cyclonedds_cpp
    published: manual
    build: null
    tested:
      # yocto/README.md, "The dev container".
      - board: KV260
        date: "2026-09-13"
        note: >-
          An interface package and an rclcpp node that depends on it, built in
          this container, ran on the KV260 (talker at 2 Hz, 26.5 MB RSS).

  - id: rpi5-yocto-jazzy
    image: rpi5-yocto
    distro: jazzy
    family: yocto-native
    board: Raspberry Pi 5 / Yocto
    boards: Raspberry Pi 5 running the Yocto image built from yocto/
    os: {name: Yocto / meta-ros, codename: scarthgap}
    arch: arm64
    platform: linux/arm64
    rmw: rmw_cyclonedds_cpp
    published: manual
    build: null
    tested: []

  # Yocto / meta-ros: the SDK packaged as a cross-build image, on top of the
  # board's bitbake-built dev container (sdk.base_image). The SDK installer is
  # a bitbake output, published as an asset of the sdk.release release and
  # pinned by checksum; the bitbake builds themselves run outside CI
  # (yocto/README.md). A new SDK means a new release and new sdk values.
  # The image runs on the host, not as the target, so platform is null. The
  # SDK's host tools are aarch64 binaries, so it is built for linux/arm64 only.
  - id: k26-oesdk-jazzy
    image: k26-oesdk
    distro: jazzy
    family: oe-sdk
    board: Kria K26 / Yocto
    boards: Kria K26 (KV260 / KR260) running the Yocto image built from yocto/
    os: {name: Yocto / meta-ros, codename: scarthgap}
    arch: arm64
    platform: null
    rmw: rmw_cyclonedds_cpp
    build:
      dir: oesdk
      dockerfile: Dockerfile
      runs_on: [self-hosted, ARM64]
      platform: linux/arm64
      sdk:
        base_image: k26-yocto-jazzy
        release: yocto-sdk-jazzy-2026.09.15
        installer: oecore-ros2-image-sdktest-jazzy-aarch64-cortexa72-cortexa53-k26-smk-kv-sdt-toolchain-nodistro.0.sh
        sha256: 99529c2bdc3a212585fcd57916865e81178d06e7d3be7e7d396a46a453213335
        env_setup: environment-setup-cortexa72-cortexa53-oe-linux
    tested:
      # README.md, "Cross-compile image from the SDK".
      - board: KV260
        date: "2026-09-15"
        note: >-
          Binaries built with the same SDK, installed on an Ubuntu base rather
          than on the dev container, ran unmodified on a KV260 booted from the
          matching Yocto image.

  - id: rpi5-oesdk-jazzy
    image: rpi5-oesdk
    distro: jazzy
    family: oe-sdk
    board: Raspberry Pi 5 / Yocto
    boards: Raspberry Pi 5 running the Yocto image built from yocto/
    os: {name: Yocto / meta-ros, codename: scarthgap}
    arch: arm64
    platform: null
    rmw: rmw_cyclonedds_cpp
    build:
      dir: oesdk
      dockerfile: Dockerfile
      runs_on: [self-hosted, ARM64]
      platform: linux/arm64
      sdk:
        base_image: rpi5-yocto-jazzy
        release: yocto-sdk-jazzy-2026.09.15
        installer: oecore-ros2-image-sdktest-jazzy-aarch64-cortexa76-raspberrypi5-toolchain-nodistro.0.sh
        sha256: a2e7e4dc2a57d9073bdaa67571fce682a112fe6a97039312e917cf517a0dd4b4
        env_setup: environment-setup-cortexa76-oe-linux
    tested: []
