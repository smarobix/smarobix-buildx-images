variables:
  # Docker-in-Docker configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

  # GitLab Container Registry
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}

stages:
  - build
  - tag

# Common script for setting up Docker buildx
.setup_buildx: &setup_buildx
  before_script:
    # Setup QEMU for ARM64 emulation
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

    # Login to GitLab Container Registry (credentials are automatically provided)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    # Create and use buildx builder
    - docker buildx create --name multiarch-builder --driver docker-container --use || true
    - docker buildx inspect --bootstrap

# Build K26 (Kria ARM64) ROS 2 Jazzy image
build:k26-jazzy:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  <<: *setup_buildx
  script:
    # Build and push K26 Jazzy ARM64 image
    - |
      docker buildx build \
        --platform linux/arm64 \
        --file dockerfiles/k26/Dockerfile.jazzy \
        --tag ${IMAGE_NAME}:k26-jazzy \
        --tag ${IMAGE_NAME}:k26-jazzy-${CI_COMMIT_SHORT_SHA} \
        --cache-from type=registry,ref=${IMAGE_NAME}:k26-jazzy-buildcache \
        --cache-to type=registry,ref=${IMAGE_NAME}:k26-jazzy-buildcache,mode=max \
        --push \
        dockerfiles/k26

  tags:
    - docker

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG

# Build K26 (Kria ARM64) ROS 2 Humble image
build:k26-humble:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  <<: *setup_buildx
  script:
    # Build and push K26 Humble ARM64 image
    - |
      docker buildx build \
        --platform linux/arm64 \
        --file dockerfiles/k26/Dockerfile.humble \
        --tag ${IMAGE_NAME}:k26-humble \
        --tag ${IMAGE_NAME}:k26-humble-${CI_COMMIT_SHORT_SHA} \
        --cache-from type=registry,ref=${IMAGE_NAME}:k26-humble-buildcache \
        --cache-to type=registry,ref=${IMAGE_NAME}:k26-humble-buildcache,mode=max \
        --push \
        dockerfiles/k26

  tags:
    - docker

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG

