variables:
  # Docker-in-Docker configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

  # GitLab Container Registry
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}

  # Image tags
  JAZZY_TAG: jazzy-base
  LATEST_TAG: latest

stages:
  - build
  - tag

# Common script for setting up Docker buildx
.setup_buildx: &setup_buildx
  before_script:
    # Setup QEMU for ARM64 emulation
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

    # Login to GitLab Container Registry (credentials are automatically provided)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    # Create and use buildx builder
    - docker buildx create --name multiarch-builder --driver docker-container --use || true
    - docker buildx inspect --bootstrap

# Build ROS 2 Jazzy ARM64 image
build:jazzy:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  <<: *setup_buildx
  script:
    # Build and push Jazzy ARM64 image
    - |
      docker buildx build \
        --platform linux/arm64 \
        --file Dockerfile.jazzy \
        --tag ${IMAGE_NAME}:${JAZZY_TAG} \
        --tag ${IMAGE_NAME}:${JAZZY_TAG}-${CI_COMMIT_SHORT_SHA} \
        --cache-from type=registry,ref=${IMAGE_NAME}:jazzy-buildcache \
        --cache-to type=registry,ref=${IMAGE_NAME}:jazzy-buildcache,mode=max \
        --push \
        .

  tags:
    - docker

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG

