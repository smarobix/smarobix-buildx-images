name: Docs

on:
  # Pull requests build the site but never publish it.
  pull_request:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - targets.yml
      - tools/**
      - README.md
      - CONTRIBUTING.md
      - .github/workflows/docs.yml
  # A release decides which .deb files and links the site prints. A release
  # that build-images.yml creates with the repository's GITHUB_TOKEN raises no
  # event, by GitHub's rule against workflows triggering workflows; the
  # schedule below then picks it up within a day.
  release:
    types: [published]
  workflow_dispatch:
  # colcon-buildx's docs are copied in at build time, so the site goes stale
  # without anything changing here. A repository_dispatch sent by colcon-buildx
  # on push to main would rebuild at once; that needs a token with write access
  # to this repository, kept as a secret over there.
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only v* releases describe the .deb packages. A yocto-sdk-* release shares
    # the release stream and changes nothing on the site.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release event runs at the tag, but the site is built from the
          # default branch; only the version comes from the release.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the documentation tools
        run: pip install -r docs/requirements.txt

      - name: Build the site
        env:
          # For the release lookup in build-site.sh, against the API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          BUILDX_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: tools/build-site.sh

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    # Pull requests stop after the build.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and never cancel one halfway through.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
