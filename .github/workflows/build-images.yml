name: Build images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# One run per ref at a time. A newer commit supersedes an older run rather
# than queueing behind it, which is what let four stale dependabot runs hold
# the self-hosted runners. Tags are exempt: a release build must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # targets.yml describes every published image once. tools/targets.py
  # validates it and turns it into the build and package matrices.
  setup:
    name: Targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      package: ${{ steps.matrix.outputs.package }}
      any_build: ${{ steps.matrix.outputs.any_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the push filter below diffs against the commit
          # that was on the branch before, which a shallow clone would not have.
          fetch-depth: 0

      # In a venv: the runner's system Python is externally managed (PEP 668)
      # and may not ship PyYAML.
      - name: Install PyYAML
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet 'PyYAML>=6,<7'
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"

      - name: Test tools/targets.py
        run: python3 tools/test_targets.py

      # The targets reference is generated from targets.yml. Without this, an
      # edit to targets.yml that skips the regeneration leaves a stale page
      # and a green build.
      - name: Check that the generated targets reference is current
        run: python3 tools/targets.py docs --check -o docs/reference/targets.md

      # Which images this event can affect. An image's own inputs are its
      # dockerfiles/<dir>/; the workflow, targets.yml and tools/targets.py
      # count for all of them (tools/targets.py SHARED_INPUTS). A tag, a
      # manual run, or a push whose previous commit is unknown builds
      # everything, because there is nothing to compare against.
      - name: Work out which images this change can affect
        id: changed
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # A pull request is checked out as its merge commit, whose first
            # parent is the base branch. That holds for a fork too, where the
            # head commit itself is not in this clone.
            base=HEAD^1
            head=HEAD
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] \
              && [ "${GITHUB_REF_TYPE}" = "branch" ] \
              && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base=${{ github.event.before }}
            head=${{ github.sha }}
          else
            echo "all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Captured first: under bash -e a failure inside a pipe would read as
          # "nothing changed" and silently skip every image.
          files=$(git diff --name-only "$base" "$head")
          printf '%s\n' "$files" > "${RUNNER_TEMP}/changed.txt"
          echo "all=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$(printf '%s\n' "$files" | grep -c .) file(s) changed since ${base}"

      - name: Generate the matrices
        id: matrix
        # Assigned first: under bash -e a failing command substitution inside
        # echo would not fail the step, and every job would get an empty matrix.
        run: |
          if [ "${{ steps.changed.outputs.all }}" = "true" ]; then
            build=$(python3 tools/targets.py matrix build)
          else
            build=$(python3 tools/targets.py matrix build --changed "${RUNNER_TEMP}/changed.txt")
          fi
          package=$(python3 tools/targets.py matrix package)
          # An empty matrix would start no jobs, but the build job reads this
          # to skip itself outright rather than reporting an empty success.
          any_build=$(printf '%s' "${build}" | python3 -c 'import json,sys; print(str(bool(json.load(sys.stdin)["include"])).lower())')
          {
            echo "build=${build}"
            echo "package=${package}"
            echo "any_build=${any_build}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${any_build} build job(s) selected"

  build:
    name: ${{ matrix.image }}-${{ matrix.distro }}
    needs: setup
    # Nothing an image is built from changed, so no runner is claimed at all.
    if: needs.setup.outputs.any_build == 'true'
    # targets.yml says why each image builds on the runner it does.
    runs-on: ${{ matrix.runs_on }}
    # A hung emulated build otherwise holds a runner for GitHub's 6 h default:
    # pynq-v3.1.1-jazzy once hung in a ros-build step that normally takes ~33 min,
    # until that limit killed it. A cold armv7 source build takes ~2.5 h, so 4 h
    # leaves room for a real build while cutting a hang much sooner.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.build) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${{ matrix.image }}-${{ matrix.distro }}"
          {
            echo "repo=${REPO}"
            echo "tag=${TAG}"
            echo "cache_ref=${REPO}:${TAG}-buildcache"
          } >> "$GITHUB_OUTPUT"

      - name: Download the Yocto SDK installer
        if: ${{ matrix.sdk_installer }}
        run: |
          mkdir -p sdk
          curl -fsSL -o "sdk/${{ matrix.sdk_installer }}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ matrix.sdk_release }}/${{ matrix.sdk_installer }}"
          echo "${{ matrix.sdk_sha256 }}  sdk/${{ matrix.sdk_installer }}" | sha256sum -c -

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: dockerfiles/${{ matrix.board_dir }}
          file: dockerfiles/${{ matrix.board_dir }}/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-contexts: ${{ matrix.sdk_installer && 'sdk=sdk' || '' }}
          # build_args holds targets.yml's build.args, one NAME=value per line.
          # BASE_IMAGE is added here because it names the registry this runs against.
          build-args: |
            ${{ matrix.build_args }}
            ${{ matrix.base_image && format('BASE_IMAGE={0}:{1}', steps.meta.outputs.repo, matrix.base_image) || '' }}
            ${{ matrix.sdk_installer && format('SDK_INSTALLER={0}', matrix.sdk_installer) || '' }}
            ${{ matrix.sdk_env_setup && format('SDK_ENV_SETUP={0}', matrix.sdk_env_setup) || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache_ref }}
          # ignore-error: the cache export and the image push run in parallel.
          # On a cold rebuild over the build host's slow uplink, GHCR rejected
          # a cache layer upload (400) after ~12 min, and BuildKit cancelled the
          # finished image push with it. A missing cache only costs the next
          # build time; a missing image is a failed release.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max,ignore-error=true', steps.meta.outputs.cache_ref) || '' }}
          # No licenses label: one SPDX expression can't cover the base OS, ROS 2 and OpenCV inside.
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=SMAROBIX GmbH

  package:
    name: Package ${{ matrix.image }}-${{ matrix.distro }}
    needs: [setup, build]
    if: startsWith(github.ref, 'refs/tags/v')
    # Matches the build job: the .deb is assembled by running the image, so run
    # arm64 images on the arm64 runner rather than under emulation.
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      # One entry per target in targets.yml with a deb block; the fields are
      # explained there.
      matrix: ${{ fromJSON(needs.setup.outputs.package) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract /opt/ros/${{ matrix.distro }} from image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ matrix.image }}-${{ matrix.distro }}"
          docker pull --platform ${{ matrix.platform }} "$IMAGE"
          CID=$(docker create --platform ${{ matrix.platform }} "$IMAGE")
          mkdir -p out/opt/ros
          docker cp "$CID:/opt/ros/${{ matrix.distro }}" "out/opt/ros/${{ matrix.distro }}"
          docker rm "$CID"

      - name: Derive runtime dependencies from the image
        id: depends
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ matrix.image }}-${{ matrix.distro }}"
          DEPS=$(docker run --rm --platform ${{ matrix.platform }} \
            -e DISTRO=${{ matrix.distro }} \
            -v "$PWD/.github/scripts/compute-depends.sh:/compute-depends.sh:ro" \
            "$IMAGE" bash /compute-depends.sh)
          if [ -z "$DEPS" ]; then
            echo "::error::dependency derivation produced nothing for ${{ matrix.image }}-${{ matrix.distro }}"
            exit 1
          fi
          echo "Derived: ${DEPS}"
          echo "depends=${DEPS}" >> "$GITHUB_OUTPUT"

      - name: Create tarball
        id: tar
        run: |
          NAME="smarobix-ros-${{ matrix.distro }}-${{ matrix.pkg }}_${{ steps.version.outputs.version }}_${{ matrix.deb_arch }}.tar.gz"
          tar -czf "$NAME" -C out opt/ros/${{ matrix.distro }}
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        id: deb
        run: |
          PKG="smarobix-ros-${{ matrix.distro }}-${{ matrix.pkg }}"
          VERSION="${{ steps.version.outputs.version }}"
          DEB_NAME="${PKG}_${VERSION}_${{ matrix.deb_arch }}.deb"
          STAGE="$(mktemp -d)/${PKG}_${VERSION}"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/ros"
          cp -a "out/opt/ros/${{ matrix.distro }}" "$STAGE/opt/ros/${{ matrix.distro }}"

          # Control fields want "a, b, c"; the postinst wants "a b c" for apt.
          SUGGESTS=$(echo "${{ matrix.suggests }}" | sed 's/  */, /g')

          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: ${PKG}
          Version: ${VERSION}
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: Sergio Pertuz <sergio@smarobix.com>
          Section: misc
          Priority: optional
          Depends: ${{ steps.depends.outputs.depends }}, ${{ matrix.depends_extra }}
          Recommends: ${{ matrix.recommends }}
          Suggests: ${SUGGESTS}
          Description: ROS 2 ${{ matrix.distro }} install tree for ${{ matrix.target }}
           Pre-built ROS 2 ${{ matrix.distro }} (ros-base minus display) for
           ${{ matrix.board }}. Built against ${{ matrix.target }}.
           Installs into /opt/ros/${{ matrix.distro }}.
          EOF

          # Recommends are pulled in by `apt install ./file.deb` but not by
          # `dpkg -i`, and neither surfaces the RMW choice or the extra step
          # needed to build packages on the board — so say it at install time.
          # ros-dev-tools in Suggests comes from the ROS 2 apt source, which the
          # user adds first with the ros2-apt-source package named below.
          cat > "$STAGE/DEBIAN/postinst" <<EOF
          #!/bin/sh
          set -e
          if [ "\$1" = "configure" ]; then
              cat <<'MSG'

          ROS 2 ${{ matrix.distro }} installed to /opt/ros/${{ matrix.distro }}

            source /opt/ros/${{ matrix.distro }}/setup.bash

          Recommended RMW (not set by this package):
            export RMW_IMPLEMENTATION=${{ matrix.rmw }}

          To build ROS packages on this board (not needed just to run nodes),
          add the ROS 2 apt source with the ros2-apt-source package, then:
            sudo apt update
            sudo apt install ${{ matrix.suggests }}
          Documentation: https://smarobix.github.io/smarobix-buildx-images/

          MSG
          fi
          exit 0
          EOF
          chmod 0755 "$STAGE/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "$STAGE" "$DEB_NAME"
          echo "name=$DEB_NAME" >> "$GITHUB_OUTPUT"
          echo "--- control ---"
          dpkg-deb -I "$DEB_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ matrix.image }}-${{ matrix.distro }}-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.tar.outputs.name }}
            ${{ steps.deb.outputs.name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: 'pkg-*'
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # The hand-made yocto-sdk-* releases that carry the SDK installers
          # share this release stream, so they must be created with
          # `gh release create ... --latest=false`. Saying it here as well
          # makes every v* release the latest one, whatever GitHub would infer.
          make_latest: true
