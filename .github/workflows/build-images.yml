name: Build images

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }}-${{ matrix.distro }}
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - board_dir: k26
            image: k26
            distro: jazzy
            platform: linux/arm64
          - board_dir: k26
            image: k26
            distro: humble
            platform: linux/arm64
          - board_dir: pynq-z1
            image: pynq-v3.1.1
            distro: jazzy
            platform: linux/arm/v7
          - board_dir: pynq-z1
            image: pynq-v3.1.1
            distro: humble
            platform: linux/arm/v7
          # Raspberry Pi OS / Debian. Debian publishes no ROS binaries for any
          # suite, so arm64 builds from source too. suite/py_ver must agree.
          # The image name carries the ISA baseline rather than a board model:
          # nothing here is Pi-specific, and the armv7 build runs on any ARMv7
          # board of that suite, not only on a Pi 5.
          - board_dir: rpi
            image: rpi-arm64-trixie
            distro: jazzy
            platform: linux/arm64
            suite: trixie
            py_ver: "3.13"
          - board_dir: rpi
            image: rpi-arm64-trixie
            distro: humble
            platform: linux/arm64
            suite: trixie
            py_ver: "3.13"
          - board_dir: rpi
            image: rpi-armv7-trixie
            distro: jazzy
            platform: linux/arm/v7
            suite: trixie
            py_ver: "3.13"
          - board_dir: rpi
            image: rpi-armv7-trixie
            distro: humble
            platform: linux/arm/v7
            suite: trixie
            py_ver: "3.13"
          - board_dir: rpi
            image: rpi-arm64-bookworm
            distro: jazzy
            platform: linux/arm64
            suite: bookworm
            py_ver: "3.11"
          - board_dir: rpi
            image: rpi-arm64-bookworm
            distro: humble
            platform: linux/arm64
            suite: bookworm
            py_ver: "3.11"
          - board_dir: rpi
            image: rpi-armv7-bookworm
            distro: jazzy
            platform: linux/arm/v7
            suite: bookworm
            py_ver: "3.11"
          - board_dir: rpi
            image: rpi-armv7-bookworm
            distro: humble
            platform: linux/arm/v7
            suite: bookworm
            py_ver: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          BASE="${{ matrix.image }}-${{ matrix.distro }}"
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            TAG="${BASE}-develop"
          else
            TAG="${BASE}"
          fi
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "cache_ref=${REPO}:${BASE}-buildcache" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: dockerfiles/${{ matrix.board_dir }}
          file: dockerfiles/${{ matrix.board_dir }}/Dockerfile.${{ matrix.distro }}
          platforms: ${{ matrix.platform }}
          build-args: |
            ${{ matrix.suite && format('SUITE={0}', matrix.suite) || '' }}
            ${{ matrix.py_ver && format('PY_VER={0}', matrix.py_ver) || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache_ref }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.meta.outputs.cache_ref) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

  package:
    name: Package ${{ matrix.image }}-${{ matrix.distro }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `image` is the GHCR tag prefix; `pkg` is the .deb name suffix, which
          # omits the architecture because dpkg already carries it in the
          # filename and the control Architecture field.
          #
          # Shared-library dependencies are NOT listed here — they are derived
          # from the built tree by .github/scripts/compute-depends.sh, so they
          # cannot drift from what the binaries actually link against. The three
          # fields below cover only what ELF inspection cannot see:
          #   depends_extra  Python modules without which `ros2` will not run
          #   recommends     optional features (cv_bridge's Python bindings,
          #                  sros2, ros2doctor) — apt installs these by default
          #                  but the tree works without them
          #   suggests       toolchain for building ROS packages on the board,
          #                  space-separated so postinst can paste it into an
          #                  apt command; the control field's comma form is
          #                  derived from it
          - image: pynq-v3.1.1
            pkg: pynq-v3.1.1
            distro: jazzy
            platform: linux/arm/v7
            deb_arch: armhf
            target: PYNQ v3.1.1 (Ubuntu 22.04)
            board: Xilinx Zynq-7020 boards (Pynq-Z1 / Pynq-Z2)
            rmw: rmw_cyclonedds_cpp
            depends_extra: "python3, python3-argcomplete, python3-lark, python3-numpy, python3-packaging, python3-psutil, python3-yaml"
            recommends: "python3-catkin-pkg, python3-cryptography, python3-lxml, python3-opencv, python3-rosdistro"
            suggests: "build-essential cmake git python3-dev python3-pip"
          - image: pynq-v3.1.1
            pkg: pynq-v3.1.1
            distro: humble
            platform: linux/arm/v7
            deb_arch: armhf
            target: PYNQ v3.1.1 (Ubuntu 22.04)
            board: Xilinx Zynq-7020 boards (Pynq-Z1 / Pynq-Z2)
            rmw: rmw_cyclonedds_cpp
            depends_extra: "python3, python3-argcomplete, python3-lark, python3-numpy, python3-packaging, python3-psutil, python3-yaml"
            recommends: "python3-catkin-pkg, python3-cryptography, python3-lxml, python3-opencv, python3-rosdistro"
            suggests: "build-essential cmake git python3-dev python3-pip"
          - image: rpi-arm64-trixie
            pkg: rpi-trixie
            distro: jazzy
            platform: linux/arm64
            deb_arch: arm64
            target: Raspberry Pi OS 13 / Debian 13 (trixie), arm64
            board: any 64-bit Raspberry Pi (3, 4, 5, Zero 2 W) or other arm64 Debian board
            rmw: rmw_fastrtps_cpp
            depends_extra: "python3, python3-argcomplete, python3-lark, python3-numpy, python3-packaging, python3-psutil, python3-yaml"
            recommends: "python3-catkin-pkg, python3-cryptography, python3-lxml, python3-opencv, python3-rosdistro"
            suggests: "build-essential cmake git python3-dev python3-pip"
          - image: rpi-arm64-trixie
            pkg: rpi-trixie
            distro: humble
            platform: linux/arm64
            deb_arch: arm64
            target: Raspberry Pi OS 13 / Debian 13 (trixie), arm64
            board: any 64-bit Raspberry Pi (3, 4, 5, Zero 2 W) or other arm64 Debian board
            rmw: rmw_fastrtps_cpp
            depends_extra: "python3, python3-argcomplete, python3-lark, python3-numpy, python3-packaging, python3-psutil, python3-yaml"
            recommends: "python3-catkin-pkg, python3-cryptography, python3-lxml, python3-opencv, python3-rosdistro"
            suggests: "build-essential cmake git python3-dev python3-pip"
          - image: rpi-armv7-trixie
            pkg: rpi-trixie
            distro: jazzy
            platform: linux/arm/v7
            deb_arch: armhf
            target: Raspberry Pi OS 13 / Debian 13 (trixie), armhf
            board: any ARMv7 Raspberry Pi (2, 3, 4, 5, Zero 2 W) on a 32-bit OS; not Pi 1 / Zero / Zero W
            rmw: rmw_cyclonedds_cpp
            depends_extra: "python3, python3-argcomplete, python3-lark, python3-numpy, python3-packaging, python3-psutil, python3-yaml"
            recommends: "python3-catkin-pkg, python3-cryptography, python3-lxml, python3-opencv, python3-rosdistro"
            suggests: "build-essential cmake git python3-dev python3-pip"
          - image: rpi-armv7-trixie
            pkg: rpi-trixie
            distro: humble
            platform: linux/arm/v7
            deb_arch: armhf
            target: Raspberry Pi OS 13 / Debian 13 (trixie), armhf
            board: any ARMv7 Raspberry Pi (2, 3, 4, 5, Zero 2 W) on a 32-bit OS; not Pi 1 / Zero / Zero W
            rmw: rmw_cyclonedds_cpp
            depends_extra: "python3, python3-argcomplete, python3-lark, python3-numpy, python3-packaging, python3-psutil, python3-yaml"
            recommends: "python3-catkin-pkg, python3-cryptography, python3-lxml, python3-opencv, python3-rosdistro"
            suggests: "build-essential cmake git python3-dev python3-pip"
          - image: rpi-arm64-bookworm
            pkg: rpi-bookworm
            distro: jazzy
            platform: linux/arm64
            deb_arch: arm64
            target: Raspberry Pi OS 12 / Debian 12 (bookworm), arm64
            board: any 64-bit Raspberry Pi (3, 4, 5, Zero 2 W) or other arm64 Debian board
            rmw: rmw_fastrtps_cpp
            depends_extra: "python3, python3-argcomplete, python3-lark, python3-numpy, python3-packaging, python3-psutil, python3-yaml"
            recommends: "python3-catkin-pkg, python3-cryptography, python3-lxml, python3-opencv, python3-rosdistro"
            suggests: "build-essential cmake git python3-dev python3-pip"
          - image: rpi-arm64-bookworm
            pkg: rpi-bookworm
            distro: humble
            platform: linux/arm64
            deb_arch: arm64
            target: Raspberry Pi OS 12 / Debian 12 (bookworm), arm64
            board: any 64-bit Raspberry Pi (3, 4, 5, Zero 2 W) or other arm64 Debian board
            rmw: rmw_fastrtps_cpp
            depends_extra: "python3, python3-argcomplete, python3-lark, python3-numpy, python3-packaging, python3-psutil, python3-yaml"
            recommends: "python3-catkin-pkg, python3-cryptography, python3-lxml, python3-opencv, python3-rosdistro"
            suggests: "build-essential cmake git python3-dev python3-pip"
          - image: rpi-armv7-bookworm
            pkg: rpi-bookworm
            distro: jazzy
            platform: linux/arm/v7
            deb_arch: armhf
            target: Raspberry Pi OS 12 / Debian 12 (bookworm), armhf
            board: any ARMv7 Raspberry Pi (2, 3, 4, 5, Zero 2 W) on a 32-bit OS; not Pi 1 / Zero / Zero W
            rmw: rmw_cyclonedds_cpp
            depends_extra: "python3, python3-argcomplete, python3-lark, python3-numpy, python3-packaging, python3-psutil, python3-yaml"
            recommends: "python3-catkin-pkg, python3-cryptography, python3-lxml, python3-opencv, python3-rosdistro"
            suggests: "build-essential cmake git python3-dev python3-pip"
          - image: rpi-armv7-bookworm
            pkg: rpi-bookworm
            distro: humble
            platform: linux/arm/v7
            deb_arch: armhf
            target: Raspberry Pi OS 12 / Debian 12 (bookworm), armhf
            board: any ARMv7 Raspberry Pi (2, 3, 4, 5, Zero 2 W) on a 32-bit OS; not Pi 1 / Zero / Zero W
            rmw: rmw_cyclonedds_cpp
            depends_extra: "python3, python3-argcomplete, python3-lark, python3-numpy, python3-packaging, python3-psutil, python3-yaml"
            recommends: "python3-catkin-pkg, python3-cryptography, python3-lxml, python3-opencv, python3-rosdistro"
            suggests: "build-essential cmake git python3-dev python3-pip"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract /opt/ros/${{ matrix.distro }} from image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ matrix.image }}-${{ matrix.distro }}"
          docker pull --platform ${{ matrix.platform }} "$IMAGE"
          CID=$(docker create --platform ${{ matrix.platform }} "$IMAGE")
          mkdir -p out/opt/ros
          docker cp "$CID:/opt/ros/${{ matrix.distro }}" "out/opt/ros/${{ matrix.distro }}"
          docker rm "$CID"

      - name: Derive runtime dependencies from the image
        id: depends
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ matrix.image }}-${{ matrix.distro }}"
          DEPS=$(docker run --rm --platform ${{ matrix.platform }} \
            -e DISTRO=${{ matrix.distro }} \
            -v "$PWD/.github/scripts/compute-depends.sh:/compute-depends.sh:ro" \
            "$IMAGE" bash /compute-depends.sh)
          if [ -z "$DEPS" ]; then
            echo "::error::dependency derivation produced nothing for ${{ matrix.image }}-${{ matrix.distro }}"
            exit 1
          fi
          echo "Derived: ${DEPS}"
          echo "depends=${DEPS}" >> "$GITHUB_OUTPUT"

      - name: Create tarball
        id: tar
        run: |
          NAME="smarobix-ros-${{ matrix.distro }}-${{ matrix.pkg }}_${{ steps.version.outputs.version }}_${{ matrix.deb_arch }}.tar.gz"
          tar -czf "$NAME" -C out opt/ros/${{ matrix.distro }}
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        id: deb
        run: |
          PKG="smarobix-ros-${{ matrix.distro }}-${{ matrix.pkg }}"
          VERSION="${{ steps.version.outputs.version }}"
          DEB_NAME="${PKG}_${VERSION}_${{ matrix.deb_arch }}.deb"
          STAGE="$(mktemp -d)/${PKG}_${VERSION}"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/ros"
          cp -a "out/opt/ros/${{ matrix.distro }}" "$STAGE/opt/ros/${{ matrix.distro }}"

          # Control fields want "a, b, c"; the postinst wants "a b c" for apt.
          SUGGESTS=$(echo "${{ matrix.suggests }}" | sed 's/  */, /g')

          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: ${PKG}
          Version: ${VERSION}
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: Sergio Pertuz <sergio@smarobix.com>
          Section: misc
          Priority: optional
          Depends: ${{ steps.depends.outputs.depends }}, ${{ matrix.depends_extra }}
          Recommends: ${{ matrix.recommends }}
          Suggests: ${SUGGESTS}
          Description: ROS 2 ${{ matrix.distro }} install tree for ${{ matrix.target }}
           Pre-built ROS 2 ${{ matrix.distro }} (ros-base minus display) for
           ${{ matrix.board }}. Built against ${{ matrix.target }}.
           Installs into /opt/ros/${{ matrix.distro }}.
          EOF

          # Recommends are pulled in by `apt install ./file.deb` but not by
          # `dpkg -i`, and neither surfaces the RMW choice or the extra step
          # needed to build packages on the board — so say it at install time.
          cat > "$STAGE/DEBIAN/postinst" <<EOF
          #!/bin/sh
          set -e
          if [ "\$1" = "configure" ]; then
              cat <<'MSG'

          ROS 2 ${{ matrix.distro }} installed to /opt/ros/${{ matrix.distro }}

            source /opt/ros/${{ matrix.distro }}/setup.bash

          Recommended RMW for this board:
            export RMW_IMPLEMENTATION=${{ matrix.rmw }}

          To build ROS packages on this board (not needed just to run nodes):
            sudo apt install ${{ matrix.suggests }}
            pip install --break-system-packages 'empy==3.3.4' colcon-common-extensions

          Debian ships empy 4.x, whose API rosidl does not support, hence the pin.

          MSG
          fi
          exit 0
          EOF
          chmod 0755 "$STAGE/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "$STAGE" "$DEB_NAME"
          echo "name=$DEB_NAME" >> "$GITHUB_OUTPUT"
          echo "--- control ---"
          dpkg-deb -I "$DEB_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ matrix.image }}-${{ matrix.distro }}-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.tar.outputs.name }}
            ${{ steps.deb.outputs.name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: 'pkg-*'
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
