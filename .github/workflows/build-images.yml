name: Build images

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYNQ_IMAGE: pynq-v3.1.1

jobs:
  build:
    name: ${{ matrix.image }}-${{ matrix.distro }}
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - board_dir: k26
            image: k26
            distro: jazzy
            platform: linux/arm64
          - board_dir: k26
            image: k26
            distro: humble
            platform: linux/arm64
          - board_dir: pynq-z1
            image: pynq-v3.1.1
            distro: jazzy
            platform: linux/arm/v7
          - board_dir: pynq-z1
            image: pynq-v3.1.1
            distro: humble
            platform: linux/arm/v7
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          BASE="${{ matrix.image }}-${{ matrix.distro }}"
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            TAG="${BASE}-develop"
          else
            TAG="${BASE}"
          fi
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "cache_ref=${REPO}:${BASE}-buildcache" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: dockerfiles/${{ matrix.board_dir }}
          file: dockerfiles/${{ matrix.board_dir }}/Dockerfile.${{ matrix.distro }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache_ref }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.meta.outputs.cache_ref) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

  package-pynq:
    name: Package ${{ matrix.distro }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    env:
      PYNQ_TARGET: PYNQ v3.1.1 (Ubuntu 22.04)
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, humble]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract /opt/ros/${{ matrix.distro }} from image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${PYNQ_IMAGE}-${{ matrix.distro }}"
          docker pull --platform linux/arm/v7 "$IMAGE"
          CID=$(docker create --platform linux/arm/v7 "$IMAGE")
          mkdir -p out/opt/ros
          docker cp "$CID:/opt/ros/${{ matrix.distro }}" "out/opt/ros/${{ matrix.distro }}"
          docker rm "$CID"

      - name: Create tarball
        id: tar
        run: |
          NAME="smarobix-ros-${{ matrix.distro }}-${PYNQ_IMAGE}_${{ steps.version.outputs.version }}_armhf.tar.gz"
          tar -czf "$NAME" -C out opt/ros/${{ matrix.distro }}
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        id: deb
        run: |
          PKG="smarobix-ros-${{ matrix.distro }}-${PYNQ_IMAGE}"
          VERSION="${{ steps.version.outputs.version }}"
          DEB_NAME="${PKG}_${VERSION}_armhf.deb"
          STAGE="$(mktemp -d)/${PKG}_${VERSION}"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/ros"
          cp -a "out/opt/ros/${{ matrix.distro }}" "$STAGE/opt/ros/${{ matrix.distro }}"
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: ${PKG}
          Version: ${VERSION}
          Architecture: armhf
          Maintainer: Sergio Pertuz <sergio@smarobix.com>
          Section: misc
          Priority: optional
          Depends: libc6, libpython3.10, libstdc++6
          Description: ROS 2 ${{ matrix.distro }} install tree for ${PYNQ_TARGET}
           Pre-built ROS 2 ${{ matrix.distro }} (ros-base minus display) for
           Xilinx Zynq-7020 boards (Pynq-Z1 / Pynq-Z2). Tested against the
           ${PYNQ_TARGET} SD-card image. Installs into /opt/ros/${{ matrix.distro }}.
          EOF
          dpkg-deb --root-owner-group --build "$STAGE" "$DEB_NAME"
          echo "name=$DEB_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.PYNQ_IMAGE }}-${{ matrix.distro }}-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.tar.outputs.name }}
            ${{ steps.deb.outputs.name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package-pynq
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: '${{ env.PYNQ_IMAGE }}-*'
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
