name: Mirror to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to mirror (e.g. k26-jazzy, pynq-z1-humble)"
        required: true
        type: string
      dockerhub_repo:
        description: "Target Docker Hub repo"
        required: true
        type: string
        default: sapertuz/smarobix-buildx

permissions:
  contents: read
  packages: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Copy multi-arch manifest
        run: |
          SRC="ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.tag }}"
          DST="docker.io/${{ inputs.dockerhub_repo }}:${{ inputs.tag }}"
          echo "Mirroring $SRC -> $DST"
          docker buildx imagetools create --tag "$DST" "$SRC"
