name: Mirror to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to mirror (e.g. k26-jazzy, pynq-z1-humble)"
        required: true
        type: string
      dockerhub_repo:
        description: "Target Docker Hub repo"
        required: true
        type: string
        default: sapertuz/smarobix-buildx

permissions:
  contents: read
  packages: read

jobs:
  mirror:
    runs-on: self-hosted
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Copy multi-arch manifest
        run: |
          SRC="ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.tag }}"
          DST="docker.io/${{ inputs.dockerhub_repo }}:${{ inputs.tag }}"
          echo "Mirroring $SRC -> $DST"
          docker buildx imagetools create --tag "$DST" "$SRC"
