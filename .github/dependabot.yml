version: 2

# The Dockerfiles pin their base images by digest, so a base moving upstream no
# longer invalidates every cached layer behind our backs. These updates keep the
# pins fresh: Dependabot opens a pull request per base image, which the path
# filter turns into a build of just that image, and the rebuild lands on main
# with a cache export instead of surprising the next unrelated pull request.
updates:
  - package-ecosystem: docker
    directory: /dockerfiles/k26
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /dockerfiles/pynq-z1
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /dockerfiles/rpi
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /dockerfiles/zynq
    schedule:
      interval: weekly
  # dockerfiles/oesdk builds on our own published dev container, which moves
  # only when we rebuild it with bitbake, so it stays on a tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
