# Every update is grouped, so a round of bumps arrives as one pull request
# rather than one per dependency. The reason is the build: a change to
# build-images.yml is an input of every image, so each action bump on its own
# used to queue the full matrix on two self-hosted runners. One grouped pull
# request costs one run.
version: 2
updates:
  # The base images each Dockerfile pins by digest. One entry per directory is
  # how the docker ecosystem works; the group folds a directory's Dockerfiles
  # into a single pull request.
  - package-ecosystem: docker
    directory: /dockerfiles/k26
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      k26-base-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /dockerfiles/pynq-z1
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pynq-base-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /dockerfiles/rpi
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      rpi-base-images:
        patterns: ["*"]

  # dockerfiles/oesdk builds on an image of ours, passed as a build argument
  # from targets.yml, so there is nothing here for dependabot to bump.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
